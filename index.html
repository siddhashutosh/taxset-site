<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaxSet</title>
    <meta
      name="description"
      content="TaxSet is a privacy-first quarterly tax set-aside estimator for freelancers and self-employed people. Nothing leaves your device." />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fffdfc;
        --border: #efe3dc;
        --text: #241813;
        --muted: #6d5a51;
        --accent: #c4663c;
        --accent-deep: #8f4526;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #140f0c;
          --border: #33251f;
          --text: #f6efea;
          --muted: #bda79c;
          --accent: #d9825c;
          --accent-deep: #f5c4ab;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 40px 20px;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.65 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 460px; text-align: center; }
      .eyebrow {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 14px;
      }
      h1 {
        font-size: clamp(32px, 8vw, 44px);
        line-height: 1.1;
        letter-spacing: -0.02em;
        margin: 0 0 16px;
      }
      p { color: var(--muted); margin: 0 0 32px; }
      nav { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      a {
        display: inline-block;
        padding: 11px 20px;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--accent-deep);
        text-decoration: none;
        font-size: 15px;
        font-weight: 600;
      }
      a:hover { border-color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">TaxSet</p>
      <h1>Know what you owe, before you spend it.</h1>
      <p>
        A quarterly tax set-aside estimator for freelancers and the self-employed. No accounts, no
        bank linking, no analytics — your figures never leave your device.
      </p>
      <nav>
        <a href="./privacy.html">Privacy policy</a>
        <a href="./support.html">Support</a>
      </nav>
    </main>
  </body>
</html>
